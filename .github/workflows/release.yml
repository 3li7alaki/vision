name: Release
# Rolling distribution: every push to main rebuilds binaries and republishes the
# single `latest` release. No version tags, no semver. install.sh always fetches `latest`.
on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cli
    strategy:
      matrix:
        include:
          - { goos: linux,  goarch: amd64 }
          - { goos: linux,  goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - name: build vision-${{ matrix.goos }}-${{ matrix.goarch }}
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          go build -trimpath \
            -ldflags "-s -w -X vision/internal/version.Version=${GITHUB_SHA::7}" \
            -o "vision-${GOOS}-${GOARCH}" ./cmd/vision
      - uses: actions/upload-artifact@v4
        with:
          name: vision-${{ matrix.goos }}-${{ matrix.goarch }}
          path: cli/vision-${{ matrix.goos }}-${{ matrix.goarch }}

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: republish the rolling `latest` release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag 2>/dev/null || true
          gh release create latest dist/vision-* \
            --repo "$GITHUB_REPOSITORY" \
            --title "latest" \
            --notes "Rolling build from ${GITHUB_SHA::7}. \`curl -fsSL https://raw.githubusercontent.com/$GITHUB_REPOSITORY/main/install.sh | sh\`"
          # gh uploads assets to a draft, then publishes it; on 2026-10-31 that last step
          # silently left mint's release a Draft and install.sh 404ed. Publish explicitly
          # and fail the job if it is still a draft.
          gh release edit latest --repo "$GITHUB_REPOSITORY" --draft=false
          test "$(gh release view latest --repo "$GITHUB_REPOSITORY" --json isDraft -q .isDraft)" = false
